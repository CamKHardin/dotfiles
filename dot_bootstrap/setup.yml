---
- name: Machine setup
  hosts: localhost
  become: true
  connection: local
  gather_facts: true
  vars:
    linux_packages_by_family:
      RedHat:
        - git
        - htop
        - gh
        - gcc
        - ripgrep
        - zsh
        - ffmpeg
        - uv
        - fzf
        - tmux
        - make
        - patch
        - wl-clipboard
        - fd-find
        - gcc-c++
        - helix
        - autoconf
        - libiodbc
        - toilet
        - unar
      Debian:
        - git
        - htop
        - gh
        - build-essential
        - ripgrep
        - zsh
        - ffmpeg
        - fzf
        - tmux
        - make
        - patch
        - xclip
        - fd-find
        - autoconf
        - libiodbc2
        - toilet
        - unar
      Archlinux:
        - git
        - htop
        - github-cli
        - gcc
        - ripgrep
        - zsh
        - ffmpeg
        - fzf
        - tmux
        - make
        - patch
        - wl-clipboard
        - fd
        - helix
        - autoconf
        - unixodbc
        - toilet
        - unar
      Suse:
        - git
        - htop
        - gh
        - gcc
        - ripgrep
        - zsh
        - ffmpeg
        - fzf
        - tmux
        - make
        - patch
        - wl-clipboard
        - fd
        - helix
        - autoconf
        - libiodbc
        - toilet
        - unar
    macos_packages:
      - git
      - htop
      - gh
      - ripgrep
      - zsh
      - ffmpeg
      - uv
      - fzf
      - tmux
      - fd
      - helix
      - unar
    zsh_shell_by_system:
      Linux: /usr/bin/zsh
      Darwin: /bin/zsh

  tasks:
    - name: Get my user
      ansible.builtin.set_fact:
        remote_regular_user: "{{ ansible_env.SUDO_USER or ansible_user_id }}"

    - name: Lookup user account details
      ansible.builtin.getent:
        database: passwd
        key: "{{ remote_regular_user }}"

    - name: Set user paths
      ansible.builtin.set_fact:
        remote_regular_user_home: "{{ getent_passwd[remote_regular_user][4] }}"
        zsh_shell_path: "{{ zsh_shell_by_system[ansible_system] | default('/usr/bin/zsh') }}"

    - name: Install Linux packages
      ansible.builtin.package:
        name: "{{ linux_packages_by_family[ansible_os_family] }}"
        state: present
      when:
        - ansible_system == "Linux"
        - ansible_os_family in linux_packages_by_family

    - name: Ensure brew exists on macOS
      ansible.builtin.command: command -v brew
      register: brew_exists
      changed_when: false
      failed_when: brew_exists.rc != 0
      when: ansible_system == "Darwin"

    - name: Install macOS packages
      ansible.builtin.shell: |
        if brew list --formula {{ item }} >/dev/null 2>&1; then
          exit 0
        fi
        brew install {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ macos_packages }}"
      changed_when: false
      when: ansible_system == "Darwin"

    - name: Check zsh binary
      ansible.builtin.stat:
        path: "{{ zsh_shell_path }}"
      register: zsh_shell_stat

    - name: Change shell to zsh
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        shell: "{{ zsh_shell_path }}"
      when: zsh_shell_stat.stat.exists

    - name: Add Brave Browser Repo (Fedora)
      ansible.builtin.yum_repository:
        name: brave-browser
        description: Brave Browser
        baseurl: https://brave-browser-rpm-release.s3.brave.com/x86_64/
        gpgkey: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        gpgcheck: true
        enabled: true
      when: ansible_distribution == "Fedora"

    - name: Import Brave Browser GPG Key (Fedora)
      ansible.builtin.rpm_key:
        key: https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
        state: present
      when: ansible_distribution == "Fedora"

    - name: Install Brave Browser (Fedora)
      ansible.builtin.dnf:
        name: brave-browser
        state: present
      when: ansible_distribution == "Fedora"

    - name: Add Docker repo (Fedora)
      ansible.builtin.yum_repository:
        name: docker
        description: Docker repo
        baseurl: "https://download.docker.com/linux/fedora/{{ ansible_distribution_major_version }}/{{ ansible_architecture }}/stable"
        gpgkey: https://download.docker.com/linux/fedora/gpg
        gpgcheck: true
        enabled: true
      when: ansible_distribution == "Fedora"

    - name: Install Docker (Fedora)
      ansible.builtin.dnf:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_distribution == "Fedora"

    - name: Add Docker group
      ansible.builtin.group:
        name: docker
        state: present
      when: ansible_system == "Linux"

    - name: Add user to docker group
      ansible.builtin.user:
        name: "{{ remote_regular_user }}"
        groups: docker
        append: true
      when: ansible_system == "Linux"

    - name: Set fonts directory
      ansible.builtin.set_fact:
        fonts_dir: "{{ remote_regular_user_home + '/Library/Fonts' if ansible_system == 'Darwin' else remote_regular_user_home + '/.fonts' }}"

    - name: Ensure fonts directory
      ansible.builtin.file:
        path: "{{ fonts_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ remote_regular_user }}"

    - name: Check fonts directory state
      ansible.builtin.stat:
        path: "{{ fonts_dir }}"
      register: fonts_dir_stat

    - name: Check if JetBrains Mono exists
      ansible.builtin.find:
        paths: "{{ fonts_dir }}"
        patterns: "JetBrainsMonoNerd*FontMono*"
        file_type: file
      register: jetbrains_mono_files
      when: fonts_dir_stat.stat.isdir | default(false)

    - name: Download JetBrains Mono
      ansible.builtin.unarchive:
        src: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.1.1/JetBrainsMono.zip
        dest: "{{ fonts_dir }}/"
        remote_src: true
        mode: "0755"
        owner: "{{ remote_regular_user }}"
      when:
        - not ansible_check_mode
        - fonts_dir_stat.stat.isdir | default(false)
        - jetbrains_mono_files.matched | int == 0
